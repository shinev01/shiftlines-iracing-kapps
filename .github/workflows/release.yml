name: Release Windows installer

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest

    steps:
      - name: Check out the release
        uses: actions/checkout@v4

      - name: Read version from the release tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.event.release.tag_name }}'.TrimStart('v')
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build one-click installer
        shell: pwsh
        run: |
          .\scripts\Build-Installer.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Attach installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ github.event.release.tag_name }}' `
            'dist\ShiftLines-Setup-${{ github.event.release.tag_name }}.exe' `
            --clobber
