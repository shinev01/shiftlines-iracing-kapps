name: Release Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest

    steps:
      - name: Check out the release
        uses: actions/checkout@v4

      - name: Read version from the release tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name || inputs.tag }}'
          $version = $tag.TrimStart('v')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build one-click installer
        shell: pwsh
        run: |
          .\scripts\Build-Installer.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Attach installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ steps.version.outputs.tag }}' `
            'dist\ShiftLines-Setup-${{ steps.version.outputs.tag }}.exe' `
            --clobber
